<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>ページが見つかりません | YANAGAWA BANKSY</title>
  <style>
    :root { --pink:#FF1F7A; --gold:#C9A96A; --ink:#0a0608; }
    * { margin:0; box-sizing:border-box; }
    body {
      min-height:100svh; background:var(--ink); color:#f3eee6;
      font-family:"Shippori Mincho","Yu Mincho",serif;
      display:flex; align-items:center; justify-content:center; padding:32px 20px;
      background-image:radial-gradient(ellipse 70% 45% at 50% 20%, rgba(255,31,122,.16), transparent 70%);
    }
    .wrap { max-width:560px; width:100%; text-align:center; }
    .logo-en { font-family:Georgia,serif; letter-spacing:.42em; color:var(--gold); font-size:15px; }
    .logo-main { font-family:Georgia,serif; letter-spacing:.2em; color:var(--pink); font-size:30px; margin:6px 0 40px;
      text-shadow:0 0 16px rgba(255,31,122,.6); }
    .code { font-family:Georgia,serif; font-size:96px; line-height:1; color:var(--gold); letter-spacing:.08em; }
    h1 { font-size:20px; font-weight:600; margin:18px 0 10px; }
    p { font-size:14px; line-height:2; color:rgba(255,255,255,.75); margin-bottom:34px; }
    .links { display:grid; gap:12px; }
    a.btn {
      display:block; padding:15px 12px; text-decoration:none; font-size:14.5px; letter-spacing:.12em;
      border:1px solid rgba(255,255,255,.4); color:#fff; border-radius:3px;
      font-family:"Noto Sans JP","Yu Gothic",sans-serif;
    }
    a.btn.primary { background:var(--pink); border-color:var(--pink); color:var(--ink); font-weight:700; }
    a.btn:hover { border-color:var(--pink); }
    a.btn.primary:hover { background:#ff4890; }
    .foot { margin-top:40px; font-size:12px; color:rgba(201,169,106,.8); letter-spacing:.08em;
      font-family:"Noto Sans JP",sans-serif; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo-en">YANAGAWA</div>
    <div class="logo-main">BANKSY</div>
    <div class="code" aria-hidden="true">404</div>
    <h1>ページが見つかりませんでした</h1>
    <p>お探しのページは移動したか、存在しないようです。<br />下のボタンから、お店の情報へどうぞ。</p>
    <nav class="links" aria-label="主要ページ">
      <a class="btn primary" href="/">トップページへ</a>
      <a class="btn" href="/#system">料金システムを見る</a>
      <a class="btn" href="/#access">アクセス（柳川駅 徒歩20秒）</a>
    </nav>
    <p class="foot">PM 21:00 — LAST ｜ 水曜定休 ｜ ご予約は Instagram @banksy.s2</p>
  </main>
</body>
</html>
